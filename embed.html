<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poster asset</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  img, video { flex: 1 1 0; min-height: 0; width: 100%; object-fit: contain; display: block; }
  p { font: 14px/1.4 system-ui, sans-serif; color: #888; padding: 1em; text-align: center; }
  #bar {
    flex: 0 0 auto; box-sizing: border-box; width: 100%; padding: 6px 10px;
    display: flex; align-items: center; gap: 8px;
    background: #15181f; color: #e8ecf3; font: 13px/1 system-ui, sans-serif;
  }
  #bar button {
    font: inherit; color: inherit; background: #2a3040; border: 1px solid #3c4458;
    border-radius: 4px; padding: 6px 12px; cursor: pointer; min-width: 40px;
  }
  #bar button:hover { background: #38405a; }
  #bar input[type=range] { flex: 1 1 auto; min-width: 0; }
  #fs-float {
    position: fixed; top: 8px; right: 8px; font: 16px/1 system-ui, sans-serif; color: #fff;
    background: rgba(20, 24, 31, 0.6); border: 0; border-radius: 4px; padding: 6px 9px;
    cursor: pointer; opacity: 0.35; transition: opacity 0.15s;
  }
  body:hover #fs-float, #fs-float:focus { opacity: 1; }
  html:-webkit-full-screen { background: #000; }
  html:fullscreen { background: #000; }
  #bar output { font-variant-numeric: tabular-nums; white-space: nowrap; }
</style>
</head>
<body>
<script>
  // Usage: embed.html?src=<file in assets/>[&bg=<css color>][&controls=1][&step=1&fps=<n>]
  // Images and GIFs render as <img>; mp4/webm render as a muted, looping, autoplaying <video>.
  // step=1 starts the video paused with frame-by-frame controls (needs fps, default 30).
  const params = new URLSearchParams(location.search);
  const name = params.get("src") || "";
  const bg = params.get("bg");
  if (bg && /^[#a-zA-Z0-9]+$/.test(bg)) document.body.style.background = bg;

  // Only serve files from this repo's assets/ folder (no external URLs, no path traversal).
  const ok = /^[\w.\-]+(\/[\w.\-]+)*$/.test(name) && !name.includes("..");
  const isVideo = /\.(mp4|webm|mov)$/i.test(name);
  const stepMode = isVideo && params.get("step") === "1";
  let el;
  if (!ok) {
    el = document.createElement("p");
    el.textContent = "Usage: embed.html?src=<file in assets/>";
  } else if (isVideo) {
    el = document.createElement("video");
    el.src = "assets/" + name;
    el.muted = el.playsInline = true;
    el.loop = el.autoplay = !stepMode;
    el.preload = "auto";
    el.controls = !stepMode && params.get("controls") === "1";
  } else {
    el = document.createElement("img");
    el.src = "assets/" + name;
    el.alt = name;
  }
  document.body.appendChild(el);

  // Full screen needs the host iframe to carry allowfullscreen; if it does not
  // (or the browser has no Fullscreen API), open the page in a new tab instead.
  function toggleFullscreen() {
    const d = document, root = d.documentElement;
    if (d.fullscreenElement || d.webkitFullscreenElement) {
      return (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    }
    const request = root.requestFullscreen || root.webkitRequestFullscreen;
    const fallback = () => window.open(location.href, "_blank");
    if (!request || !(d.fullscreenEnabled || d.webkitFullscreenEnabled)) return fallback();
    try {
      const done = request.call(root);
      if (done && done.catch) done.catch(fallback);
    } catch {
      fallback();
    }
  }
  if (ok && !stepMode) {
    const fs = document.createElement("button");
    fs.id = "fs-float";
    fs.title = "Full screen";
    fs.innerHTML = "&#x2922;";
    fs.onclick = toggleFullscreen;
    document.body.appendChild(fs);
    if (!el.controls) el.onclick = toggleFullscreen;
  }

  if (stepMode) {
    const fps = Number(params.get("fps")) > 0 ? Number(params.get("fps")) : 30;
    const bar = document.createElement("div");
    bar.id = "bar";
    bar.innerHTML =
      '<button id="back" title="Back 1 frame (left arrow)">&#9664; 1</button>' +
      '<button id="play" title="Play / pause (space)">&#9654;</button>' +
      '<button id="fwd" title="Forward 1 frame (right arrow)">1 &#9654;</button>' +
      '<input id="seek" type="range" min="0" max="0" step="1" value="0">' +
      '<output id="count">-</output>' +
      '<button id="fs" title="Full screen (f)">&#x2922;</button>';
    document.body.appendChild(bar);
    const $ = (id) => document.getElementById(id);
    const seek = $("seek"), count = $("count"), play = $("play");
    let total = 1, frame = 0;

    // Seek to the middle of a frame so rounding never lands on its neighbour.
    const show = (n) => {
      frame = Math.min(total - 1, Math.max(0, n));
      el.currentTime = (frame + 0.5) / fps;
      render();
    };
    const render = () => {
      seek.value = frame;
      count.textContent = (frame + 1) + " / " + total;
    };
    const step = (d) => { el.pause(); show(frame + d); };
    const toggle = () => {
      if (!el.paused) return el.pause();
      if (frame >= total - 1) show(0);
      el.play();
    };

    el.addEventListener("loadedmetadata", () => {
      total = Math.max(1, Math.round(el.duration * fps));
      seek.max = total - 1;
      show(0);
    });
    el.addEventListener("timeupdate", () => {
      if (el.paused) return;
      frame = Math.min(total - 1, Math.floor(el.currentTime * fps));
      render();
    });
    el.addEventListener("play", () => { play.innerHTML = "&#10074;&#10074;"; });
    el.addEventListener("pause", () => { play.innerHTML = "&#9654;"; show(frame); });
    $("back").onclick = () => step(-1);
    $("fwd").onclick = () => step(1);
    play.onclick = toggle;
    $("fs").onclick = toggleFullscreen;
    el.ondblclick = toggleFullscreen;
    seek.oninput = () => { el.pause(); show(Number(seek.value)); };
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") step(-1);
      else if (e.key === "ArrowRight") step(1);
      else if (e.key === " " && e.target.tagName !== "BUTTON") toggle();
      else if (e.key === "f") toggleFullscreen();
      else return;
      e.preventDefault();
    });
  }
</script>
</body>
</html>
